# Real Estate Domain Configuration
domain: "real_estate"

# Pydantic schema field definitions
schema:
  city: "string"
  locality: "string"
  bhk: "integer"
  property_type: ["flat", "house", "plot", "villa", "pg"]
  transaction: ["buy", "rent"]
  budget_min: "integer"
  budget_max: "integer"
  furnishing: ["furnished", "semi", "unfurnished"]
  possession: ["ready_to_move", "under_construction"]
  area_sqft_min: "integer"
  area_sqft_max: "integer"
  near: "list_of_strings"
  price_preference: ["cheap", "premium", "none"]

# Currency unit multipliers (INR)
units:
  k: 1000
  thousand: 1000
  hazar: 1000
  lakh: 100000
  lakhs: 100000
  lac: 100000
  lacs: 100000
  l: 100000
  crore: 10000000
  crores: 10000000
  cr: 10000000

